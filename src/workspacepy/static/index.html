<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WorkspacePy</title>
<link rel="stylesheet" href="/vendor/katex/katex.min.css">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header id="topbar">
  <h1>WorkspacePy</h1>
  <span id="status">conectado</span>
  <span class="spacer"></span>
  <label title="Mostrar funciones, clases y módulos"><input type="checkbox" id="showHidden"> funciones/módulos</label>
  <button id="btnLayout" class="icon" title="Cambiar disposición (lado a lado / apilado)">⬓</button>
  <button id="btnTheme" class="icon" title="Tema claro/oscuro">◐</button>
  <button id="btnRefresh" class="icon" title="Refrescar">⟳</button>
</header>

<div id="main">
  <section id="wsPane" aria-label="Workspace">
    <div id="wsTools">
      <input type="search" id="filter" placeholder="Filtrar variables…" aria-label="Filtrar variables">
      <button id="btnCols" title="Elegir columnas (como el clic derecho en la cabecera de MATLAB)">Columnas ▾</button>
    </div>
    <div id="wsScroll"></div>
  </section>
  <div id="splitter" role="separator" aria-orientation="vertical" tabindex="0"></div>
  <section id="viewPane" aria-label="Visores de objetos">
    <div id="tabs" role="tablist"></div>
    <div id="viewBody">
      <div id="placeholder">Haz <kbd>doble clic</kbd> en una variable para abrirla.<br>Puedes tener varias abiertas a la vez en pestañas.</div>
    </div>
  </section>
</div>

<div id="colMenu" class="hidden"></div>
<div id="ctxMenu" class="hidden"></div>

<script src="/vendor/katex/katex.min.js"></script>
<script src="/js/api.js"></script>
<script src="/js/plots.js"></script>
<script src="/js/grid.js"></script>
<script src="/js/viewers.js"></script>
<script src="/js/app.js"></script>
</body>
</html>
