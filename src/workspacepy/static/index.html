<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WorkspacePy</title>
<link rel="stylesheet" href="/vendor/katex/katex.min.css">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header id="topbar">
  <h1>WorkspacePy</h1>
  <span class="spacer"></span>
  <button id="btnLayout" class="icon" title="Toggle layout" aria-label="Toggle layout">⬓</button>
  <button id="btnTheme" class="icon" title="Light / dark theme" aria-label="Toggle theme">◐</button>
  <button id="btnRefresh" class="icon" title="Refresh" aria-label="Refresh">⟳</button>
</header>

<div id="main">
  <section id="wsPane" aria-label="Workspace">
    <div id="wsTools">
      <span id="status" class="dot" title="Connected" role="status"></span>
      <input type="search" id="filter" placeholder="Filter" aria-label="Filter variables">
      <button id="btnCols" class="icon" title="Columns" aria-label="Choose columns" aria-expanded="false"></button>
    </div>
    <div id="wsScroll"></div>
  </section>
  <div id="splitter" role="separator" aria-orientation="vertical" tabindex="0"></div>
  <section id="viewPane" aria-label="Object viewers">
    <div id="tabs" role="tablist"></div>
    <div id="viewBody">
      <div id="placeholder">Double-click a variable to open it.</div>
    </div>
  </section>
</div>

<div id="colMenu" class="hidden"></div>
<div id="ctxMenu" class="hidden"></div>

<script src="/vendor/katex/katex.min.js"></script>
<script src="/vendor/morphicons/morphicons.js"></script>
<script src="/js/api.js"></script>
<script src="/js/plots.js"></script>
<script src="/js/grid.js"></script>
<script src="/js/viewers.js"></script>
<script src="/js/app.js"></script>
</body>
</html>
