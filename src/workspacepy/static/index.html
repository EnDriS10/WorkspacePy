<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WorkspacePy</title>
<link rel="stylesheet" href="/vendor/katex/katex.min.css">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header id="topbar">
  <h1>WorkspacePy</h1>
  <span id="status">connected</span>
  <span class="spacer"></span>
  <label title="Show functions, classes and modules"><input type="checkbox" id="showHidden"> functions/modules</label>
  <button id="btnLayout" class="icon" title="Toggle layout (side by side / stacked)">⬓</button>
  <button id="btnTheme" class="icon" title="Light/dark theme">◐</button>
  <button id="btnRefresh" class="icon" title="Refresh">⟳</button>
</header>

<div id="main">
  <section id="wsPane" aria-label="Workspace">
    <div id="wsTools">
      <input type="search" id="filter" placeholder="Filter variables…" aria-label="Filter variables">
      <button id="btnCols" title="Choose columns (like right-clicking the MATLAB header)">Columns ▾</button>
    </div>
    <div id="wsScroll"></div>
  </section>
  <div id="splitter" role="separator" aria-orientation="vertical" tabindex="0"></div>
  <section id="viewPane" aria-label="Object viewers">
    <div id="tabs" role="tablist"></div>
    <div id="viewBody">
      <div id="placeholder">Double-click a variable to open it.<br>You can keep several open at once, in tabs.</div>
    </div>
  </section>
</div>

<div id="colMenu" class="hidden"></div>
<div id="ctxMenu" class="hidden"></div>

<script src="/vendor/katex/katex.min.js"></script>
<script src="/js/api.js"></script>
<script src="/js/plots.js"></script>
<script src="/js/grid.js"></script>
<script src="/js/viewers.js"></script>
<script src="/js/app.js"></script>
</body>
</html>
