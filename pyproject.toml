[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "workspacepy"
version = "0.1.0"
description = "Un workspace estilo MATLAB para Jupyter/VS Code: tabla de variables, estadísticas y visores de arrays, SciPy, SymPy y pandas."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "César Acosta Martínez" }]
keywords = ["jupyter", "matlab", "workspace", "variable explorer", "numpy", "scipy", "sympy"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Framework :: Jupyter",
    "Topic :: Scientific/Engineering",
]
# Sin dependencias obligatorias: funciona con lo que ya tengas instalado.
dependencies = []

[project.optional-dependencies]
numpy = ["numpy"]
full = ["numpy", "scipy", "sympy", "pandas"]
dev = ["pytest", "numpy", "scipy", "sympy", "pandas"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
workspacepy = ["static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
