<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 540" width="920" height="540" role="img" aria-label="MATLAB-style layout in VS Code: code on the left, Variable Viewer to its right, Workspace on the far right; both draggable">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#10141b"/><stop offset="1" stop-color="#171c26"/></linearGradient>
    <style>
      .t{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;fill:#c8d1e0}
      .m{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;font-size:11px;fill:#8b96a8;letter-spacing:.8px}
      .h{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;font-size:13px;font-weight:600;fill:#e3e8f0}
      .k{fill:#ff7b72}.f{fill:#d2a8ff}.s{fill:#a5d6ff}.c{fill:#6e7a8c}
      .tag{font-family:system-ui,sans-serif;font-size:13px;font-weight:700;fill:#0f1218}
    </style>
  </defs>
  <rect width="920" height="540" rx="16" fill="url(#bg)"/>
  <rect x="16" y="16" width="888" height="508" rx="10" fill="#14181f" stroke="#2b3240"/>
  <!-- title bar -->
  <circle cx="36" cy="34" r="5" fill="#ff5f56"/><circle cx="54" cy="34" r="5" fill="#ffbd2e"/><circle cx="72" cy="34" r="5" fill="#27c93f"/>
  <text x="460" y="38" text-anchor="middle" class="m">analysis.ipynb — VS Code</text>
  <!-- activity bar -->
  <rect x="17" y="52" width="40" height="471" fill="#10141b"/>
  <rect x="29" y="66" width="16" height="16" rx="3" fill="none" stroke="#5b9cff" stroke-width="1.6"/><path d="M29 71h16M35 71v11" stroke="#5b9cff" stroke-width="1.4"/>
  <rect x="29" y="102" width="16" height="16" rx="3" fill="none" stroke="#4a5262" stroke-width="1.4"/>
  <rect x="29" y="138" width="16" height="16" rx="3" fill="none" stroke="#4a5262" stroke-width="1.4"/>
  <!-- editor (left) -->
  <rect x="57" y="52" width="273" height="471" fill="#161b23"/>
  <rect x="57" y="52" width="273" height="28" fill="#1b212b"/><text x="74" y="70" class="t">analysis.ipynb</text>
  <g class="t">
    <text x="74" y="106"><tspan class="k">import</tspan> numpy <tspan class="k">as</tspan> np</text>
    <text x="74" y="126"><tspan class="k">import</tspan> workspacepy</text>
    <text x="74" y="146">workspacepy.<tspan class="f">start</tspan>()</text>
    <text x="74" y="178">t = np.<tspan class="f">linspace</tspan>(0, 10, 2000)</text>
    <text x="74" y="198">signal = np.<tspan class="f">exp</tspan>(-.15*t)*</text>
    <text x="74" y="218">         np.<tspan class="f">sin</tspan>(7.5*t)</text>
    <text x="74" y="250" class="c"># double-click a variable →</text>
  </g>
  <!-- middle: variable viewer, an editor tab beside the code -->
  <rect x="330" y="52" width="267" height="471" fill="#1b1f27" stroke="#2b3240"/>
  <rect x="330" y="52" width="267" height="28" fill="#1b212b"/>
  <rect x="338" y="56" width="74" height="24" rx="3" fill="#232833"/><text x="348" y="72" class="t">signal ×</text>
  <rect x="416" y="56" width="52" height="24" rx="3" fill="#1b1f27"/><text x="426" y="72" class="t">A ×</text>
  <path d="M338 80h74" stroke="#5b9cff" stroke-width="2"/>
  <path d="M348 190 C 372 130, 392 230, 420 170 S 470 120, 490 180 S 530 240, 560 170" fill="none" stroke="#5b9cff" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M348 250h230M348 100v150" stroke="#2b3240"/>
  <text x="348" y="274" class="m">Line · Histogram · Bars · Data</text>
  <!-- right: workspace -->
  <rect x="597" y="52" width="306" height="471" fill="#1b1f27" stroke="#2b3240"/>
  <text x="613" y="74" class="m">WORKSPACE</text>
  <rect x="597" y="88" width="306" height="22" fill="#232833"/>
  <text x="613" y="103" class="m">NAME</text><text x="676" y="103" class="m">VALUE</text><text x="800" y="103" class="m">SIZE</text><text x="850" y="103" class="m">CLASS</text>
  <g class="t">
    <rect x="598" y="150" width="304" height="22" fill="#28406b"/>
    <text x="613" y="125">A</text><text x="676" y="125">&lt;8×6 float64&gt;</text><text x="800" y="125">8×6</text><text x="850" y="125">ndarray</text>
    <text x="613" y="147">f</text><text x="676" y="147">sin(x)…</text><text x="800" y="147">1×1</text><text x="850" y="147">Add</text>
    <text x="613" y="167">signal</text><text x="676" y="167">&lt;2000 float64&gt;</text><text x="800" y="167">2000</text><text x="850" y="167">ndarray</text>
    <text x="613" y="189">t</text><text x="676" y="189">&lt;2000 float64&gt;</text><text x="800" y="189">2000</text><text x="850" y="189">ndarray</text>
  </g>
  <!-- numbered tags -->
  <g>
    <circle cx="82" cy="420" r="14" fill="#5b9cff"/><text x="82" y="425" text-anchor="middle" class="tag">1</text>
    <circle cx="355" cy="420" r="14" fill="#5b9cff"/><text x="355" y="425" text-anchor="middle" class="tag">2</text>
    <circle cx="625" cy="420" r="14" fill="#5b9cff"/><text x="625" y="425" text-anchor="middle" class="tag">3</text>
  </g>
  <text x="82" y="458" class="h">Your code</text><text x="82" y="476" class="m">on the left</text>
  <text x="355" y="458" class="h">Variable Viewer</text><text x="355" y="476" class="m">opens right of your code</text><text x="355" y="494" class="m">(drag the tab anywhere)</text>
  <text x="625" y="458" class="h">Workspace</text><text x="625" y="476" class="m">live variables</text><text x="625" y="494" class="m">(drag the view anywhere)</text>
</svg>
